<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#47D7AC">
<title>Raw Material Ordering — Balter Brewing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>

<header>
  <div class="header-in">
    <img class="logo" src="logo.svg" alt="Balter Brewing" width="44" height="44">
    <div class="brand">
      <span class="kicker">Balter Brewing · Supply Planning</span>
      <h1>Raw Material Ordering</h1>
    </div>
    <div class="spacer"></div>
    <div class="datebox" role="group" aria-label="Stock count date">
      <label for="dateInput" class="datelabel">Stock counted</label>
      <button class="btn icon" id="prevDay" title="Previous day" aria-label="Previous day">‹</button>
      <input type="date" id="dateInput" aria-label="Stock count date">
      <button class="btn icon" id="nextDay" title="Next day" aria-label="Next day">›</button>
    </div>
    <nav class="actions" aria-label="Actions">
      <button class="btn teal" id="copyBtn">Copy order summary</button>
      <button class="btn" id="printBtn">Print</button>
    </nav>
  </div>
  <nav class="jump" aria-label="Sections">
    <a href="#order">Order desk</a>
    <a href="#space">Pallet space</a>
    <a href="#inputs">Brew plan &amp; stock</a>
    <a href="#settings">Settings</a>
  </nav>
</header>

<main class="page" id="app" aria-live="polite"><div class="loading">Loading…</div></main>

<footer class="foot">Balter Brewing · Raw material ordering · Figures are saved in this browser only — use Export in Settings to back up or move them.</footer>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="delFile" accept=".xlsx,.xlsm" multiple hidden>
<input type="file" id="invFile" accept=".xlsx,.xlsm" hidden>
<input type="file" id="lbbFile" accept=".xlsx,.xlsm" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
